//Settings
name "New Player"
cl_showfps 1
cl_rollangle 0
cl_rollspeed 0
default_fov 90
sensitivity 0.8
volume 0.02
MP3Volume 0.01
suitvolume 0
gamma 5
brightness 5
lightgamma 1.81
//gl_texturemode "GL_NEAREST_MIPMAP_NEAREST" <- remove "//" if you want to disable texture filtering.

//binds
bind mwheelup "+jump"
bind mwheeldown "+jump"
bind y "npc_moveto" // moves NPC to position you're aiming, if they follow you.
bind u "npc_return" // forces an NPC to return to you, if they follow you.
bind z "npc_findcover" // scares NPC, if they follow you.
bind k  "kill"
bind l "stuck" // in case you're stuck on the map.
bind enter "messagemode"
bind . "bind alt +duck"
bind / "unbind alt"

//binds for dedictaed server (svends.exe)
bind f1 "rcon_password 123456;rcon toggle_survival_mode" // switches survival mode
bind f2 "rcon_password 123456;rcon sys_ticrate 20"
bind f3 "rcon_password 123456;rcon sys_ticrate 200"
bind f8 "rcon_password 123456;rcon restart" // in case you fail a map or strat, like in hl_c11_a3 or hl_c04

//binds for listen server hosted in-game.
bind x "fps_max 20" 
bind c "fps_max 200"

unbind space
unbind alt