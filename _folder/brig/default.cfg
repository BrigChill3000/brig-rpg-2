// Clean Half-Life controls, used as defaults before the player's config.cfg.
bind "w" "+forward"
bind "s" "+back"
bind "a" "+moveleft"
bind "d" "+moveright"
bind "SPACE" "+jump"
bind "CTRL" "+duck"
bind "SHIFT" "+speed"
bind "e" "+use"
bind "r" "+reload"
bind "f" "impulse 100"
bind "q" "lastinv"
bind "MOUSE1" "+attack"
bind "MOUSE2" "+attack2"
bind "MWHEELUP" "invprev"
bind "MWHEELDOWN" "invnext"
bind "1" "slot1"
bind "2" "slot2"
bind "3" "slot3"
bind "4" "slot4"
bind "5" "slot5"
bind "TAB" "+showscores"
bind "ESCAPE" "cancelselect"
bind "`" "toggleconsole"
bind "~" "toggleconsole"
bind "F6" "save quick"
bind "F9" "load quick"
bind "y" "messagemode"
bind "u" "messagemode2"
bind "PAUSE" "pause"
hud_fastswitch "0"
hud_draw "1"
cl_lw "1"
cl_lc "1"
crosshair "1"
joystick "0"
sensitivity "3"
volume "0.7"
