name: Release brig for steam_legacy

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v1.0.0 (new tags use the selected ref)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: brig-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      commit: ${{ steps.meta.outputs.commit }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate tag and record checked-out commit
        id: meta
        shell: python
        run: |
          import os, re, subprocess
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[A-Za-z0-9][A-Za-z0-9._-]{0,79}', tag):
              raise SystemExit('Invalid release tag')
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'tag={tag}\ncommit={commit}\n')
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x86
      - name: Compile game DLLs for Windows x86
        run: msbuild projects/vs2019/projects.sln -t:rebuild -p:Configuration=Release -p:Platform=Win32 -p:PlatformToolset=v143 -p:PostBuildEventUseInBuild=false -maxcpucount:2
      - name: Test resource policy
        run: python -m unittest discover -s tests -v
      - name: Build verified installation archive
        env:
          RELEASE_COMMIT: ${{ steps.meta.outputs.commit }}
        run: python tools/package_brig.py --client projects/vs2019/Release/hl_cdll/client.dll --server projects/vs2019/Release/hldll/hl.dll --version "$env:RELEASE_TAG" --commit "$env:RELEASE_COMMIT"
      - uses: actions/upload-artifact@v4
        with:
          name: brig-release
          path: |
            dist/*.zip
            dist/*.sha256
          compression-level: 0
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: brig-release
          path: dist
      - name: Publish release and attach archive with SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.package.outputs.commit }}
        run: python tools/publish_brig_release.py
